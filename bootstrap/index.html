<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="stylesheet" href="./node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        body{
            background-color: #2F3457;
        }
        header{
            background-color: #7533F9;
            color: #FFFFFF;
        }

        header nav{
            height: 70px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }

        header nav div{
            padding: 10px;
            align-items: center;
        }

        header nav div span{
            padding: 10px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
        }

        .nav-items{
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-around;
        }

        .logo{
            margin-left: 40px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            font-size: 30px;
            font-weight: bold;
        }
        .search-bar{
            border: 1px solid #b7b5b5;
            border-radius: 5px;
            width: 250px;
            height: 15px;
            background-color: #692CDF;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            color: #b7b5b5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .search-bar div span{
            margin: -10px;
        }
        .bi-search{
            font-size: 20px;
        }
        .cmd-icon{
            background-color: #421C8B;
            border-radius: 5px;
            padding: 2px;
        }

        .external-link{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            margin-right: 80px;
        }

        .social-link{
            border-right: 1px solid #828181;
        }

        .social-link span{
            padding: 5px;
            font-size: 15px;
        }

        .version{
            border-right: 1px solid #828181;
            margin: 5px;
        }

        .version span{
            padding: 0px;
        }

        .theme-mode span{
            padding: 0px;
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <div class="nav-items">
                <span class="bi bi-bootstrap logo"></span>
                <span>Docs</span>
                <span>Examples</span>
                <span>Icons</span>
                <span>Blog</span>
            </div>

            <div class="search-bar">
                <div>
                    <span class="bi bi-search"></span>
                    <span>Search</span>
                </div>
                
                <div class="cmd-icon">
                    <span class="bi bi-command"></span>
                    <span>K</span>
                </div>
            </div>

            <div class="external-link">
                <div class="social-link">
                    <span class="bi bi-github"></span>
                    <span class="bi bi-twitter-x"></span>
                    <span class="bi bi-opencollective"></span>
                </div>
                
                <div class="version">
                    <span>v5.3</span>
                    <span class="bi bi-caret-down-fill"></span>
                </div>
                
                <div class="theme-mode">
                    <span class="bi bi-sun"></span>
                    <span class="bi bi-caret-down-fill"></span>
                </div>
                
            </div>
        </nav>
    </header>
</body>
</html>
