<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: pink;
        }
        dialog{
            width: 500px;
            margin: 30px auto;
        }
        header{
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: row;
            height: 100px;
            padding: 15px;
            background-color: #fff;
            padding-left: 20px;
        }
        .bi-x-lg{
            font-size: 25px;
        }
        dialog{
            background-color: #e9e8e8ad;
        }
        main{
            margin: 20px;
            padding: 20px;
        }
        main p{
            padding: 25px;
            margin: 10px;
            background-color: #fff;
            border-radius: 10px;
            border: 1px solid gray;
        }
        footer{
            display: flex;
            justify-content: end;
            align-items: center;
            flex-direction: row;
            height: 20px;
            padding: 40px;
            padding-bottom: 45px;
        }
        footer p{
            background-color: #3067c5;
            padding: 15px;
            margin-bottom: 15px;
            color: white;
            border-radius: 10px;
        }
        .select{
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <dialog open>
        <header>
            <h1>Talk to Adviser Form</h1>
            <p><span class="bi bi-x-lg"></span></p>
        </header>
        <main>
            <p>Full Name</p>
            <p>Mobile Number</p>
            <p>Email address</p>
            <p class="select">
                <span>Select Course</span>
                <span class="bi bi-caret-down"></span>
            </p>
        </main>
        <footer>
            <p>Submit</p>
        </footer>
    </dialog>
</body>
</html>
