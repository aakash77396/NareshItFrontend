<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <title>Document</title>
    <style>
        header {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            padding: 20px;
            background-color: #e2dfdf;
            display: flex;
            flex-direction: row;
            justify-content:space-between;
            align-items: center;
        }
        .brand-logo{
            font-family: Comic Sans MS;
            font-size: 40px;
            font-weight: bold;
            color: red;
            margin-right: 10px;
        }
        nav span{
            text-transform: uppercase;
            font-weight: bold;
            font-size: 18px;
            margin-right: 15px;
        }
        .search-bar{
            background-color: #c9c9c9;
            padding: 10px;
            width: 350px;
            border-radius: 5px;
        }
        .placeholder{
            font-size: 15px;
            margin-left: 20px;
            padding: 20px;
            color: gray;
        }
        .bi-person, .bi-heart, .bi-bag{
            font-size: 22px;
        }
        .shortcut-item-text{
            font-size: 14px;
            font-weight: bold;
            display: block;
        }
        .shortcut-item{
            text-align: center;
        }
        .shortcuts{
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 200px;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <nav>
                <span class="brand-logo">M</span>
                <span>Men</span>
                <span>Women</span>
                <span>Kids</span>
                <span>Home</span>
                <span>Beauty</span>
                <span>GenZ</span>
                <span>Studio</span>
            </nav>
        </div>

        <div>
            <div class="search-bar">
                <span class="bi bi-search"></span>
                <span class="" placeholder>Search for products, brands and more</span>
            </div>
        </div>

        <div>
            <div class="shortcuts">
                <div class="shortcut-item">
                    <sapn class="bi bi-person"></sapn>
                    <sapn class="shortcut-item-text">Profile</sapn>
                </div>

                <div class="shortcut-item">
                    <sapn class="bi bi-heart"></sapn>
                    <sapn class="shortcut-item-text">Wishlist</sapn>
                </div>

                <div class="shortcut-item">
                    <sapn class="bi bi-bag"></sapn>
                    <sapn class="shortcut-item-text">Bag</sapn>
                </div>
            </div>
        </div>
    </header>
</body>

</html>
