<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SideBar</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style>

        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;font-family: Arial, Helvetica, sans-serif;

        }
        ul{
            list-style: none;
        }
        .section-title{
            margin: 10px;
            padding: 10px;
            font-size: 20px;
        }

        li{
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 300px;
            padding: 10px;
            margin: 10px;
            background-color: #f7f6f6;
            border-radius: 10px;
            height: 50px;
        }
        .bi{
            padding: 10px;
        }

        .bi-compass-fill{
            color: blue;
        }

        .bi-fire{
            color: orange;
        }
        .bi-arrow-up-right-circle-fill{
            color: gray;
        }
        .bi-flag{
            color: red;
        }
        .bi-heart{
            color: gray;
        }
        .bi-clock-history{
            color: gray;
        }
        .all{
            background-color: rgba(0, 0, 255, 0.715);
            padding: 10px;
            color: white;
            border-radius: 10px;
        }

        .hot{
            background-color: rgba(86, 86, 206, 0.593);
            padding: 10px;
            color: white;
            border-radius: 10px;
        }
        .discount{
            background-color: rgb(208, 57, 120);
            padding: 10px;
            color: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <section>
            <div class="section-title"> BROWSE CATALOG</div>
            <ul>
                <li><div><span class="bi bi-compass-fill"></span> <span>Discover Products</span></div> <div class="all">All</div> </li>
                <li><div><span class="bi bi-fire"></span><span>Best Sellers</span> </div> <div class="hot">Hot</div></li>
                <li><div><span class="bi bi-arrow-up-right-circle-fill"></span><span>Trending Now</span></li>
                <li><div><span class="bi bi-flag"></span><span>Flash Deal</span> </div> <div class="discount">-40%</div></li>
                <li><div><span class="bi bi-heart"></span><span>My Saved Items</span>  </div> <div class="hot">14</div></li>
                <li><div><span class="bi bi-clock-history"></span><span>Purchase History</span></li>
            </ul>
        </section>
    </nav>
</body>
</html>
