<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .container {
            font-family: Arial, Helvetica, sans-serif;
            width: 800px;
            height: 500px;
            background: url("./public/imgs/nareshitlogo.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px auto;
            border: 1px solid black;
        }

        .container h1 {
            text-shadow: 1px 1px 10px yellow;
        }
        .repeat{
            width: 800px;
            height: 500px;
            background: url("./public/imgs/nareshitlogo.webp");
            /* background-size: cover; */
            /* background-position: center; */
            background-repeat: repeat;
            margin: 20px 0px;
            border: 1px solid black;
        }
        .repeat-gallery{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .repeat-x{
            width: 800px;
            height: 500px;
            background: url("./public/imgs/nareshitlogo.webp");
            /* background-size: cover; */
            /* background-position: center; */
            background-repeat: repeat-x;
            margin: 20px 0px;
            border: 1px solid black;
        }
        .repeat-y{
            width: 800px;
            height: 500px;
            background: url("./public/imgs/nareshitlogo.webp");
            /* background-size: cover; */
            /* background-position: center; */
            background-repeat: repeat-y;
            margin: 20px 0px;
            border: 1px solid black;
        }
        .no-repeat{
            width: 800px;
            height: 500px;
            background: url("./public/imgs/nareshitlogo.webp");
            /* background-size: cover; */
            /* background-position: center; */
            background-repeat: no-repeat;
            margin: 20px 0px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            background-position: center;
        }
        .space{
            width: 800px;
            height: 500px;
            background: url("./public/imgs/nareshitlogo.webp");
            /* background-size: cover; */
            /* background-position: center; */
            background-repeat: space;
            margin: 20px 0px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            background-position: center;
        }
        .round{
            width: 800px;
            height: 500px;
            background: url("./public/imgs/nareshitlogo.webp");
            /* background-size: cover; */
            /* background-position: center; */
            background-repeat: round;
            margin: 20px 0px;
            border: 1px solid black;
            display: flex;
            justify-content: center;
            background-position: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome My Friend</h1>
    </div>
    <div class="repeat-gallery">
        <div class="repeat">
        </div>
        <div class="repeat-x">
        </div>
        <div class="repeat-y">
        </div>
        <div class="no-repeat">
        </div>
        <div class="space">
        </div>
        <div class="round">
        </div>
        
    </div>
</body>

</html>
